schema_version: "1.1"
name: standards-for-small-agency
expected_outcome: |
  Produces a first standards sheet proportionate to a 15-person agency: two or three project sizes with suggested boundaries, a short list of required documents per size drawn from the core set, simple approval rules, status colour definitions and a reporting rhythm. Every rule the organisation has not stated is labelled as suggested and needing approval. Remaining unknowns are listed as open questions. Does not impose many stage gates or extended documents on small projects. Names a next step.
